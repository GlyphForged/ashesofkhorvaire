[package]
name = "ashes-wiki"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.14.0"
axum = { version = "0.8.4", features = ["form", "query"] }
html-escape = "0.2.13"
once_cell = "1.21.3"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
slug = "0.1.6"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6.6", features = ["fs", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
urlencoding = "2.1.3"

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.20.0"
tower = { version = "0.5.2", features = ["util"] }
