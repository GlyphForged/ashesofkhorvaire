<section class="revision-list"><h2>Revision history</h2>{% for revision in revisions %}<article><div><strong>{{ revision.edit_summary }}</strong><p class="muted"><time data-unix="{{ revision.created_at }}">{{ revision.created_at }}</time> · {{ revision.type_label() }}</p></div><a class="button" href="/pages/{{ page.slug }}/revisions/{{ revision.id }}">View</a></article>{% endfor %}</section>
