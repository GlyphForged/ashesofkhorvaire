{% extends "base.html" %}{% block title %}{{ page.title }} · Ashes of Khorvaire{% endblock %}{% block content %}
<article><header class="page-header"><div><p class="eyebrow">{{ page.type_label() }} {% if page.is_gm_secret %}<span class="secret">GM SECRET</span>{% endif %}</p><h1>{{ page.title }}</h1><p class="muted">Updated <time data-unix="{{ page.updated_at }}">{{ page.updated_at }}</time></p></div><div class="actions"><a class="button primary" href="/pages/{{ page.slug }}/edit">Edit</a><a class="button" href="/pages/{{ page.slug }}/revisions">History</a></div></header>
<div class="prose">{{ rendered|safe }}</div><footer class="dossier-footer"><button class="text-button" hx-get="/pages/{{ page.slug }}/revisions" hx-target="#revision-panel" hx-swap="innerHTML">Load revision history</button><div id="revision-panel"></div></footer></article>{% endblock %}
