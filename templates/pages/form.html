{% extends "base.html" %}{% block title %}{{ heading }} · Ashes of Khorvaire{% endblock %}{% block content %}
<header class="page-header"><div><p class="eyebrow">Field records</p><h1>{{ heading }}</h1></div></header>
<form class="editor-form" method="post" action="{{ action }}"><div class="form-grid"><label>Title<input required name="title" value="{{ form.title }}" data-title></label><label>Slug<input name="slug" value="{{ form.slug }}" data-slug aria-describedby="slug-preview"><small id="slug-preview">Preview: <span hx-get="/pages/slug-preview" hx-trigger="input from:[data-title] changed delay:200ms, input from:[data-slug] changed delay:200ms" hx-include="[data-title],[data-slug]">generated on save</span></small></label>
<label>Content type<select name="content_type" required>{% for item in types %}<option value="{{ item.0 }}" {% if form.content_type == item.0 %}selected{% endif %}>{{ item.1 }}</option>{% endfor %}</select></label><label class="check"><input type="checkbox" name="is_gm_secret" value="true" {% if form.is_gm_secret %}checked{% endif %}> Mark as GM secret</label></div>
<fieldset class="editor-field"><legend>Contents</legend><div class="mode-switch" role="group" aria-label="Editing mode"><button type="button" class="active" data-mode="visual">Visual</button><button type="button" data-mode="raw">Raw HTML</button></div><div id="visual-editor"></div><textarea id="raw-editor" name="body_html" rows="20">{{ form.body_html }}</textarea><noscript><p class="notice">JavaScript is off; edit the raw HTML below.</p></noscript></fieldset>
<label>Edit summary <input name="edit_summary" value="{{ form.edit_summary }}" placeholder="Optional — what changed?"></label><div class="form-actions"><button class="button primary" type="submit">Save dossier</button><a class="button" href="/pages">Cancel</a></div></form>
{% if is_edit %}<form class="danger-zone" method="post" action="{{ archive_action }}" onsubmit="return confirm('Archive this dossier? It can be restored later.')"><button class="text-button danger">Archive dossier</button></form>{% endif %}{% endblock %}{% block scripts %}<script src="/static/vendor/pell.min.js"></script><script src="/static/js/editor.js"></script>{% endblock %}
